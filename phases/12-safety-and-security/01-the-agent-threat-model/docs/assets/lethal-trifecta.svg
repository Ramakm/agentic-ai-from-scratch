<text x="495.0" y="240.0" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#7a7a78" text-anchor="middle">mail · files · drive</text>
<rect x="309" y="384" width="180" height="58" fill="#1d7a82" stroke="#1d7a82" stroke-width="1.5"/>
<rect x="305" y="380" width="180" height="58" fill="#d8eded" stroke="#1d7a82" stroke-width="1.5"/>
