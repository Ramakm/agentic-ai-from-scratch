<rect x="205" y="196" width="180" height="58" fill="#f6ecd0" stroke="#b07d0c" stroke-width="1.5"/>
<text x="295.0" y="222.0" font-family="'Space Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#b07d0c" font-weight="600" text-anchor="middle">Untrusted content</text>
<text x="295.0" y="240.0" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#7a7a78" text-anchor="middle">email · web pages · issues</text>
<rect x="409" y="200" width="180" height="58" fill="#7a4cb3" stroke="#7a4cb3" stroke-width="1.5"/>
<rect x="405" y="196" width="180" height="58" fill="#ebe2f6" stroke="#7a4cb3" stroke-width="1.5"/>
