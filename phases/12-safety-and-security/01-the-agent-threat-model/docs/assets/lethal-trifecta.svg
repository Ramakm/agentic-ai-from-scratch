<text x="395.0" y="424.0" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#7a7a78" text-anchor="middle">send · fetch URL · images</text>
<rect x="34" y="304" width="120" height="52" fill="#EC4D36" stroke="#EC4D36" stroke-width="1.5"/>
<rect x="30" y="300" width="120" height="52" fill="#fde5e0" stroke="#EC4D36" stroke-width="1.5"/>
<text x="90.0" y="323.0" font-family="'Space Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#EC4D36" font-weight="600" text-anchor="middle">Attacker</text>
<text x="90.0" y="341.0" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#7a7a78" text-anchor="middle">writes text</text>
<path d="M90 300 L90 225 L201 225" fill="none" stroke="#EC4D36" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar-red)"/>
<text x="98" y="262" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#EC4D36">1 plants an</text>
<text x="98" y="276" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#EC4D36">instruction</text>
<path d="M385 225 L401 225" fill="none" stroke="#EC4D36" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar-red)"/>
<path d="M495 254 L495 300 L420 376" fill="none" stroke="#EC4D36" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ar-red)"/>
<text x="503" y="296" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#EC4D36">2 agent reads</text>
<text x="503" y="310" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#EC4D36">the secret</text>
<path d="M301 409 L90 409 L90 356" fill="none" stroke="#EC4D36" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#ar-red)"/>
<text x="150" y="400" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#EC4D36">3 secret leaves</text>
<line x1="620" y1="160" x2="620" y2="500" stroke="#1a1a1a" stroke-width="1" opacity="0.15"/>
<text x="650" y="172" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#1a1a1a">CUT ANY ONE LEG</text>
<rect x="650" y="196" width="104" height="28" fill="#d8eded" stroke="#1d7a82" stroke-width="1.2"/>
<text x="702.0" y="214.2" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#1d7a82" text-anchor="middle">egress</text>
<text x="650" y="246" font-family="'Source Serif 4',Georgia,'Times New Roman',serif" font-size="12.5" fill="#4a4a4a" font-style="italic">approve sends · allow-list URLs ·</text>
<text x="650" y="263" font-family="'Source Serif 4',Georgia,'Times New Roman',serif" font-size="12.5" fill="#4a4a4a" font-style="italic">images only from your domain</text>
<rect x="650" y="292" width="104" height="28" fill="#f6ecd0" stroke="#b07d0c" stroke-width="1.2"/>
<text x="702.0" y="310.2" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#b07d0c" text-anchor="middle">untrusted</text>
<text x="650" y="342" font-family="'Source Serif 4',Georgia,'Times New Roman',serif" font-size="12.5" fill="#4a4a4a" font-style="italic">read it in another session (dual LLM) ·</text>
<text x="650" y="359" font-family="'Source Serif 4',Georgia,'Times New Roman',serif" font-size="12.5" fill="#4a4a4a" font-style="italic">pass on only a typed summary</text>
<rect x="650" y="388" width="104" height="28" fill="#ebe2f6" stroke="#7a4cb3" stroke-width="1.2"/>
<text x="702.0" y="406.2" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#7a4cb3" text-anchor="middle">private</text>
<text x="650" y="438" font-family="'Source Serif 4',Georgia,'Times New Roman',serif" font-size="12.5" fill="#4a4a4a" font-style="italic">no secrets in this session ·</text>
<text x="650" y="455" font-family="'Source Serif 4',Georgia,'Times New Roman',serif" font-size="12.5" fill="#4a4a4a" font-style="italic">brokered credentials</text>
<text x="40" y="520" font-family="'Source Serif 4',Georgia,'Times New Roman',serif" font-size="12.5" fill="#7a7a78" font-style="italic">Untrusted text + an irreversible action is a second path, even with no private data.</text>
<text x="928" y="544" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="10" letter-spacing="1.5" fill="#7a7a78" text-anchor="end">AGENTIC AI FROM SCRATCH</text>
</svg>
