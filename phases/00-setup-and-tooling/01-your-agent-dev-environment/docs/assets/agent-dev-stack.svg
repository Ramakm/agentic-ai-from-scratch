<text x="32" y="80" font-family="'Space Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="30" font-weight="700" letter-spacing="-0.5" fill="#1a1a1a">The agent dev stack</text>
<text x="32" y="106" font-family="'Source Serif 4',Georgia,'Times New Roman',serif" font-size="16" fill="#4a4a4a" text-anchor="start" font-style="italic">Four layers. A failure in a lower one looks like a bug in the one above it.</text>
