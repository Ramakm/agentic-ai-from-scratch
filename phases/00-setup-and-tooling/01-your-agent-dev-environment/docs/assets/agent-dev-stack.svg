<text x="72" y="276" font-family="'Space Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="600" fill="#7a4cb3">Model access</text>
<text x="72" y="296" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#1a1a1a" text-anchor="start">scripted (default) · Ollama · hosted API</text>
<text x="72" y="312" font-family="'Source Serif 4',Georgia,'Times New Roman',serif" font-size="12.5" fill="#4a4a4a" text-anchor="start" font-style="italic">one shape: OpenAI-compatible /chat/completions</text>
