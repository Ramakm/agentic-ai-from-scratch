[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-from-scratch"
version = "0.1.0"
description = "An agent harness built from scratch: loop, tools, context, MCP, subagents, permissions, evals, CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
harness = "harness.cli:main"

[tool.setuptools]
packages = ["harness"]
