name: Bug report
description: Something in a lesson, its code, or the site is wrong or broken
labels: [bug]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: Lesson id (e.g. 03.01), file path, or site URL
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Commands you ran and their output. Remove any API keys.
      render: shell
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Python version, model and provider (e.g. Ollama llama3.2)
